{% extends "admin/base.html" %}
{% block title %}Сотрудник{% endblock %}
{% block content %}
<div class="page-head">
  <div class="page-head-title">
    <h1>{{ 'Редактировать' if employee else 'Новый' }} сотрудник</h1>
    <p class="muted small">Сотрудник входит в личный кабинет по табельному номеру и паролю.</p>
  </div>
  <div class="page-head-actions">
    <a class="btn btn-ghost" href="{{ url_for('admin_employees') }}">← К списку</a>
  </div>
</div>

<form method="post" class="form-panel">
  <div class="panel">
    <div class="form-grid">
      <label>Табельный номер
        <input type="text" name="employee_id" value="{{ employee.employee_id if employee else '' }}" required>
      </label>
      <label>Фамилия
        <input type="text" name="last_name" value="{{ last_name if last_name is defined else '' }}" required>
      </label>
      <label>Имя
        <input type="text" name="first_name" value="{{ first_name if first_name is defined else '' }}" required>
      </label>
      <label>Пароль
        <input type="text" name="password" id="password" {% if not employee %}required{% endif %} autocomplete="off">
        <span class="input-hint">
          {% if employee %}Оставьте пустым, чтобы не менять.{% else %}Минимум 6 символов.{% endif %}
        </span>
      </label>
      <div class="field-action">
        <button class="btn btn-outline" type="button" id="gen-password">Сгенерировать пароль</button>
      </div>
    </div>
    <label class="checkbox"><input type="checkbox" name="is_active" {% if not employee or employee.is_active %}checked{% endif %}> Активен</label>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Сохранить</button>
    <a class="btn btn-outline" href="{{ url_for('admin_employees') }}">Отмена</a>
  </div>
</form>
{% endblock %}

{% block scripts %}
<script>
(function () {
  var input = document.getElementById('password');
  var btn = document.getElementById('gen-password');
  var chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function generate() {
    var s = '';
    var arr = new Uint32Array(8);
    crypto.getRandomValues(arr);
    for (var i = 0; i < 8; i++) {
      s += chars[arr[i] % chars.length];
    }
    return s;
  }
  btn.addEventListener('click', function () {
    input.value = generate();
  });
})();
</script>
{% endblock %}
