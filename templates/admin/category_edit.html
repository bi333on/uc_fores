{% extends "admin/base.html" %}
{% block title %}Категория{% endblock %}
{% block content %}
<div class="page-head">
  <div class="page-head-title">
    <h1>{{ 'Редактировать' if category else 'Новая' }} категория</h1>
    <p class="muted small">Категория — это курс: к нему привязываются документы и тесты.</p>
  </div>
  <div class="page-head-actions">
    <a class="btn btn-ghost" href="{{ url_for('admin_categories') }}">← К списку</a>
  </div>
</div>

<form method="post" class="form-panel">
  <div class="panel">
    <div class="form-grid">
      <label>Название
        <input type="text" name="title" value="{{ category.title if category else '' }}" required>
      </label>
      <label>Slug
        <input type="text" name="slug" value="{{ category.slug if category else '' }}">
        <span class="input-hint">Оставьте пустым для автогенерации из названия.</span>
      </label>
      <label class="full">Описание
        <textarea name="description" rows="3">{{ category.description if category else '' }}</textarea>
      </label>
      <label>Порядок
        <input type="number" name="sort_order" value="{{ category.sort_order if category else 0 }}">
        <span class="input-hint">Чем меньше число, тем выше в списке.</span>
      </label>
    </div>
    <label class="checkbox"><input type="checkbox" name="is_active" {% if not category or category.is_active %}checked{% endif %}> Активна</label>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Сохранить</button>
    <a class="btn btn-outline" href="{{ url_for('admin_categories') }}">Отмена</a>
  </div>
</form>
{% endblock %}
