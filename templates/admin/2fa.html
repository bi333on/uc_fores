{% extends "admin/auth_base.html" %}
{% block title %}Двухфакторная аутентификация{% endblock %}
{% block content %}
<div class="auth-card admin-login">
  <h1>Введите код из приложения</h1>
  <p class="muted">Откройте Google Authenticator и введите 6-значный код.</p>
  {% if error %}<div class="flash flash-danger">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('admin_2fa') }}">
    <label>Код
      <input class="code-input" type="text" name="code" required autofocus inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
    </label>
    <button class="btn btn-primary btn-block" type="submit">Подтвердить</button>
  </form>
</div>
{% endblock %}
