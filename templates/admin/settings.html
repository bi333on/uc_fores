{% extends "admin/base.html" %}
{% block title %}Настройки{% endblock %}
{% block content %}
<h1>Настройки</h1>
<form method="post">
  <label>Название сайта
    <input type="text" name="site_name" value="{{ data.site_name }}">
  </label>
  <label>Организация (для сертификата)
    <input type="text" name="cert_org_name" value="{{ data.cert_org_name }}">
  </label>
  <label>Подпись (должность/ФИО руководителя, для сертификата)
    <input type="text" name="cert_signature" value="{{ data.cert_signature }}">
  </label>
  <button class="btn btn-primary" type="submit">Сохранить</button>
</form>
{% endblock %}
