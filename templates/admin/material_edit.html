{% extends "admin/base.html" %}
{% block title %}Нормативный документ{% endblock %}
{% block content %}
<h1>{{ 'Редактировать' if material else 'Новый' }} документ</h1>
<form method="post" enctype="multipart/form-data">
  <label>Название
    <input type="text" name="title" value="{{ material.title if material else '' }}" required>
  </label>
  <label>Категория
    <select name="category_id" required>
      {% for c in categories %}
      <option value="{{ c.id }}" {% if material and material.category_id == c.id %}selected{% endif %}>{{ c.title }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Описание
    <textarea name="description">{{ material.description if material else '' }}</textarea>
  </label>
  <label>Текст документа (опционально, вместо/вместе с PDF)
    <textarea name="content" rows="8">{{ material.content if material else '' }}</textarea>
  </label>
  <label>Файл — PDF или изображение JPG/JPEG ({% if material and material.file_path %}заменяет текущий: {{ material.file_path }}{% else %}опционально{% endif %})
    <input type="file" name="file" accept=".pdf,.jpg,.jpeg">
  </label>
  <label>Порядок
    <input type="number" name="sort_order" value="{{ material.sort_order if material else 0 }}">
  </label>
  <label class="checkbox"><input type="checkbox" name="is_active" {% if not material or material.is_active %}checked{% endif %}> Активен</label>
  <button class="btn btn-primary" type="submit">Сохранить</button>
  <a class="btn btn-outline" href="{{ url_for('admin_materials') }}">Отмена</a>
</form>
{% endblock %}
