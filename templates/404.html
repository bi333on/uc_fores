{% extends "base.html" %}
{% block title %}Страница не найдена — {{ site_name }}{% endblock %}
{% block content %}
<div class="notfound">
  <div class="code">404</div>
  <h1>Страница не найдена</h1>
  <p>Возможно, она была удалена или ссылка устарела.</p>
  <a class="btn btn-primary btn-lg" href="{{ url_for('index') }}">На главную</a>
</div>
{% endblock %}
