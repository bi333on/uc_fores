{% extends "base.html" %}
{% block title %}Смена пароля — {{ site_name }}{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Смена пароля</h1>
  <p class="muted">При первом входе необходимо задать новый пароль.</p>
  {% if error %}<div class="flash flash-danger">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('change_password') }}">
    <label>Новый пароль
      <input type="password" name="password" required autofocus>
    </label>
    <label>Повторите пароль
      <input type="password" name="password2" required>
    </label>
    <button class="btn btn-primary" type="submit">Сохранить пароль</button>
  </form>
</div>
{% endblock %}
